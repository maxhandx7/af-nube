<svg width="400" height="200" viewBox="0 0 400 200" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>pasa.lat</title>
  <desc>Logo de pasa.lat</desc>

  <defs>
    <style>
      .bg-pill { fill: transparent; }
      .wordmark-pasa { fill: #18181b; }
      .wordmark-lat  { fill: #7c3aed; }
      .arrow-track { stroke: #e5e7eb; }
      .arrow-body  { stroke: #7c3aed; }
      .circle-left  { fill: #f3f0ff; stroke: #7c3aed; stroke-width: 2; }
      .circle-right { fill: #7c3aed; }
      .icon-left  { stroke: #7c3aed; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-right { stroke: #ffffff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .dot { fill: #7c3aed; }
      .tagline { fill: #9ca3af; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; }
      .logo-text { font-family: ui-monospace, 'Cascadia Code', monospace; }
      @media (prefers-color-scheme: dark) {
        .bg-pill { fill: #1e1e2e; }
        .wordmark-pasa { fill: #f1f5f9; }
        .wordmark-lat  { fill: #a78bfa; }
        .arrow-track { stroke: #2d2d44; }
        .arrow-body  { stroke: #a78bfa; }
        .circle-left  { fill: #2d2d44; stroke: #a78bfa; stroke-width: 2; }
        .circle-right { fill: #a78bfa; }
        .icon-left  { stroke: #a78bfa; }
        .icon-right { stroke: #1e1e2e; }
        .dot { fill: #a78bfa; }
        .tagline { fill: #6b7280; }
      }
    </style>
  </defs>

  <!-- Fondo pill -->
  <rect x="10" y="10" width="380" height="180" rx="20" class="bg-pill"/>

  <!-- Track punteado -->
  <line x1="105" y1="95" x2="295" y2="95" stroke-width="1.5" stroke-dasharray="5 4" class="arrow-track"/>

  <!-- Círculo izquierdo -->
  <circle cx="105" cy="95" r="26" class="circle-left"/>
  <!-- Upload icon -->
  <polyline points="105,88 105,100" class="icon-left"/>
  <polyline points="100,93 105,88 110,93" class="icon-left"/>
  <rect x="96" y="100" width="18" height="10" rx="2" class="icon-left"/>

  <!-- Círculo derecho -->
  <circle cx="295" cy="95" r="26" class="circle-right"/>
  <!-- Download icon -->
  <polyline points="295,88 295,100" class="icon-right"/>
  <polyline points="290,96 295,101 300,96" class="icon-right"/>
  <rect x="286" y="101" width="18" height="10" rx="2" class="icon-right"/>

  <!-- Flecha -->
  <line x1="138" y1="95" x2="262" y2="95" stroke-width="2" stroke-linecap="round" class="arrow-body"/>
  <polyline points="254,88 264,95 254,102" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" class="arrow-body"/>

  <!-- Punto viajero (estático en SVG standalone) -->
  <circle cx="200" cy="95" r="4" class="dot"/>

  <!-- Wordmark -->
  <text x="200" y="148" text-anchor="middle" font-size="32" font-weight="700" letter-spacing="-0.5" class="logo-text wordmark-pasa">pasa<tspan class="wordmark-lat">.lat</tspan></text>

  <!-- Tagline -->
  <text x="200" y="166" text-anchor="middle" class="tagline">comparte al instante · sin cuenta · se autodestruye</text>

</svg>
